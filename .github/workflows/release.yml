name: Build and publish Windows release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Setup installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Configure temporary release paths
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP "dgfp-release"
          $publishRoot = Join-Path $workRoot "publish"
          "DGFP_RELEASE_WORK_DIR=$workRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DGFP_PUBLISH_DIR=$publishRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve and validate release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $config = Get-Content -Raw config/app_version.json | ConvertFrom-Json
          $version = [string]$config.version
          $releaseNotes = @($config.releaseNotes | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
          $expectedTag = [string]$config.releaseTag
          if ([string]::IsNullOrWhiteSpace($expectedTag)) {
            $expectedTag = "v$version"
          }
          $releaseTag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $expectedTag
          } else {
            $env:GITHUB_REF_NAME
          }

          if ($releaseTag -ne $expectedTag) {
            throw "Release tag '$releaseTag' must match config/app_version.json version '$expectedTag'."
          }
          if ($releaseNotes.Count -eq 0) {
            throw "config/app_version.json must include at least one releaseNotes entry."
          }

          $existingRelease = @(
            gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName |
              ConvertFrom-Json |
              Where-Object { $_.tagName -eq $releaseTag }
          )
          $releaseExists = $existingRelease.Count -gt 0

          $displayLabel = [string]$config.label
          if ([string]::IsNullOrWhiteSpace($displayLabel)) {
            $displayLabel = $version
          }

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TITLE=Data Generator & File Processing - $displayLabel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_EXISTS=$($releaseExists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run syntax and smoke tests
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Launch and verify the Electron UI
        run: pnpm run test:e2e

      - name: Build Setup installer
        run: pnpm run dist

      - name: Verify release output and create checksum
        run: |
          $installers = @(Get-ChildItem -LiteralPath $env:DGFP_PUBLISH_DIR -File -Filter *.exe)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one release executable, but found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($installer.Name -notmatch " Setup ") {
            throw "The release executable is not the Setup installer: $($installer.Name)"
          }

          if ($installer.Length -lt 1MB) {
            throw "The Setup installer is unexpectedly small: $($installer.Length) bytes."
          }

          $releaseAssetName = $installer.Name -replace " ", "."
          $releaseAssetPath = Join-Path $env:DGFP_PUBLISH_DIR $releaseAssetName
          Move-Item -LiteralPath $installer.FullName -Destination $releaseAssetPath
          $installer = Get-Item -LiteralPath $releaseAssetPath

          $header = [System.IO.File]::ReadAllBytes($installer.FullName)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            throw "The Setup installer does not have a valid Windows executable header."
          }

          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $env:DGFP_PUBLISH_DIR "SHA256SUMS.txt"
          "$sha256 *$($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA256=$sha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Authenticode signature
        if: ${{ env.WIN_CSC_LINK != '' }}
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:INSTALLER_PATH
          if ($signature.Status -ne "Valid") {
            throw "The Setup installer signature is not valid: $($signature.StatusMessage)"
          }

      - name: Install and launch the packaged application
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "dgfp-installed-smoke"
          $smokeResultPath = Join-Path $env:RUNNER_TEMP "dgfp-installed-smoke-result.json"
          Remove-Item -LiteralPath $smokeResultPath -Force -ErrorAction SilentlyContinue
          $installerResult = Start-Process -FilePath $env:INSTALLER_PATH -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($installerResult.ExitCode -ne 0) {
            throw "Silent installation failed with exit code $($installerResult.ExitCode)."
          }
          $appExecutable = Get-ChildItem -LiteralPath $installRoot -Recurse -File -Filter *.exe |
            Where-Object { $_.Name -eq "Data Generator & File Processing.exe" } |
            Select-Object -First 1
          if (-not $appExecutable) {
            throw "The installed application executable was not found."
          }
          $env:DGFP_SMOKE_RESULT_PATH = $smokeResultPath
          $launchResult = Start-Process -FilePath $appExecutable.FullName -ArgumentList "--smoke-test" -Wait -PassThru
          if ($launchResult.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $smokeResultPath) {
              Get-Content -LiteralPath $smokeResultPath
            }
            throw "The installed application smoke launch failed with exit code $($launchResult.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $smokeResultPath)) {
            throw "The installed application did not produce its smoke-test result."
          }
          $smokeResult = Get-Content -LiteralPath $smokeResultPath -Raw | ConvertFrom-Json
          if (-not $smokeResult.ok) {
            throw "The installed application reported a failed smoke test: $($smokeResult.error)"
          }

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: data-generator-file-processing-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.DGFP_PUBLISH_DIR }}/*.exe
            ${{ env.DGFP_PUBLISH_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $config = Get-Content -Raw config/app_version.json | ConvertFrom-Json
          $highlights = @($config.releaseNotes | ForEach-Object { "- $_" })
          if ($highlights.Count -eq 0) {
            $highlights = @("- See the automatically generated change list below.")
          }

          $notes = @(
            "## Windows installer",
            "",
            "Download **$env:INSTALLER_NAME** and run it to install the application.",
            "",
            "## Release highlights",
            ""
          ) + $highlights + @(
            "",
            "## Verify the download",
            "",
            "SHA-256: ``$env:INSTALLER_SHA256``",
            "",
            "The same digest is included in **SHA256SUMS.txt**."
          )

          if ($env:RELEASE_EXISTS -eq "true") {
            gh release upload $env:RELEASE_TAG `
              $env:INSTALLER_PATH `
              "$env:DGFP_PUBLISH_DIR/SHA256SUMS.txt" `
              --repo $env:GITHUB_REPOSITORY `
              --clobber

            gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --notes ($notes -join "`n") `
              --latest
          } else {
            gh release create $env:RELEASE_TAG `
              $env:INSTALLER_PATH `
              "$env:DGFP_PUBLISH_DIR/SHA256SUMS.txt" `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --notes ($notes -join "`n") `
              --latest
          }

          $published = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json url,name,tagName,isDraft,isPrerelease,assets | ConvertFrom-Json

          if ($published.isDraft -or $published.isPrerelease) {
            throw "The published release is unexpectedly marked as draft or prerelease."
          }
          if ($published.assets.Count -ne 2) {
            throw "Expected exactly the Setup installer and SHA256SUMS.txt, but found $($published.assets.Count) assets."
          }

          $published | ConvertTo-Json -Depth 5
